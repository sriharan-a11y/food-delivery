services:

  food-delivery-db:
    image: postgres:16
    container_name: food-delivery-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: food_delivery

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  food-delivery:
    build: .

    container_name: food-delivery-container

    depends_on:
      food-delivery-db:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8000:8000"


volumes:
  postgres_data: